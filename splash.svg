<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>

    <style>
      @font-face {
        font-family: 'Fredoka';
        font-weight: 400 700;
        src: url('fonts/fredoka-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'DM Mono';
        font-weight: 400;
        src: url('fonts/dmmono-400-latin.woff2') format('woff2');
      }
    </style>

    <!-- Pink → purple gradient (note + text) -->
    <linearGradient id="brand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f472b6"/>
      <stop offset="50%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c6af7"/>
    </linearGradient>

    <!-- Halo glow behind note -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7c6af7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7c6af7" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter on note -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <rect width="1080" height="1920" fill="#1a1535"/>

  <!-- ── Scattered emoji texture ─────────────────────────────────────── -->

  <!-- top band -->
  <text x="30"  y="175" font-size="80" opacity="0.45" transform="rotate(-18,30,175)">🎹</text>
  <text x="860" y="115" font-size="64" opacity="0.40" transform="rotate(14,860,115)">🎻</text>
  <text x="410" y="75"  font-size="68" opacity="0.35" transform="rotate(-9,410,75)">🎺</text>
  <text x="680" y="240" font-size="58" opacity="0.42" transform="rotate(22,680,240)">🎸</text>
  <text x="140" y="360" font-size="54" opacity="0.38" transform="rotate(-26,140,360)">🥁</text>
  <text x="910" y="390" font-size="66" opacity="0.40" transform="rotate(11,910,390)">🪈</text>

  <!-- middle sides -->
  <text x="10"  y="720" font-size="72" opacity="0.38" transform="rotate(-16,10,720)">🎷</text>
  <text x="950" y="680" font-size="60" opacity="0.42" transform="rotate(18,950,680)">🎵</text>
  <text x="20"  y="1080" font-size="64" opacity="0.36" transform="rotate(-12,20,1080)">🎶</text>
  <text x="930" y="1130" font-size="68" opacity="0.40" transform="rotate(24,930,1130)">🎼</text>

  <!-- bottom band -->
  <text x="60"  y="1490" font-size="74" opacity="0.42" transform="rotate(-21,60,1490)">🎹</text>
  <text x="840" y="1470" font-size="58" opacity="0.38" transform="rotate(17,840,1470)">🎻</text>
  <text x="330" y="1690" font-size="62" opacity="0.40" transform="rotate(-14,330,1690)">🎸</text>
  <text x="660" y="1740" font-size="66" opacity="0.42" transform="rotate(9,660,1740)">🥁</text>
  <text x="130" y="1820" font-size="56" opacity="0.35" transform="rotate(-30,130,1820)">🎺</text>
  <text x="800" y="1845" font-size="60" opacity="0.38" transform="rotate(20,800,1845)">🪈</text>

  <!-- ── Halo glow behind note ──────────────────────────────────────── -->
  <ellipse cx="540" cy="590" rx="280" ry="260" fill="url(#halo)"/>

  <!-- ── Musical note (gradient, glowing) ─────────────────────────── -->
  <g transform="translate(540,570) scale(0.37) translate(-512,-512)"
     fill="url(#brand)" filter="url(#glow)">
    <path d="M 418,217 L 794,257 L 794,337 L 418,297 Z"/>
    <rect x="418" y="217" width="42" height="514"/>
    <rect x="752" y="257" width="42" height="504"/>
    <ellipse cx="335" cy="731" rx="105" ry="76" transform="rotate(-20,335,731)"/>
    <ellipse cx="668" cy="761" rx="105" ry="76" transform="rotate(-20,668,761)"/>
  </g>

  <!-- ── App name (Fredoka) ─────────────────────────────────────────── -->
  <text x="540" y="910"
        font-family="'Fredoka', sans-serif"
        font-size="108" font-weight="700" text-anchor="middle"
        fill="url(#brand)">Crescendo</text>
  <text x="540" y="1030"
        font-family="'Fredoka', sans-serif"
        font-size="108" font-weight="700" text-anchor="middle"
        fill="url(#brand)">Kids</text>

  <!-- Thin divider -->
  <rect x="360" y="1062" width="360" height="1.5" fill="url(#brand)" opacity="0.45"/>

  <!-- ── Practice Journal (DM Mono) ────────────────────────────────── -->
  <text x="540" y="1118"
        font-family="'DM Mono', monospace"
        font-size="36" font-weight="400" text-anchor="middle"
        fill="white" opacity="0.70" letter-spacing="5">PRACTICE JOURNAL</text>

</svg>
